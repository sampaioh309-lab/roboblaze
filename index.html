<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Double PRO</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#020617;
    color:#fff;
    overflow-y:auto;
}

/* FUNDO ANIMADO */
.fundo{
    position:fixed;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;

    background:
        linear-gradient(rgba(34,197,94,0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.25) 1px, transparent 1px);
    background-size:30px 30px;
    animation: gridMove 2s linear infinite;
}

.fundo::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(255,0,0,0.25), transparent 60%);
    animation: girar 6s linear infinite;
}

.fundo::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.1), transparent);
    animation: brilhoMove 3s linear infinite;
}

@keyframes gridMove{
    from{ transform:translate(0,0); }
    to{ transform:translate(30px,30px); }
}

@keyframes girar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

@keyframes brilhoMove{
    from{ transform:translateX(-100%); }
    to{ transform:translateX(100%); }
}

.container{
    position:relative;
    z-index:1;
    padding-bottom:80px;
}

.topo{
    text-align:center;
    padding:15px;
    font-size:22px;
}

.relogio{
    font-size:26px;
    color:#22c55e;
}

button, label{
    width:90%;
    margin:10px auto;
    display:block;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#000;
    text-align:center;
}

input{ display:none; }

.preview{
    position:relative;
    width:90%;
    margin:10px auto;
}

.preview img{
    width:100%;
    border-radius:10px;
    filter: brightness(0.5);
}

.scan{
    position:absolute;
    width:100%;
    height:3px;
    background:red;
    box-shadow:0 0 10px red;
    animation: scanMove 2s infinite alternate;
}

@keyframes scanMove{
    from{ top:0; }
    to{ top:100%; }
}

.barra{
    width:90%;
    height:20px;
    background:#111;
    margin:10px auto;
    border-radius:10px;
    overflow:hidden;
}

.progresso{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#4ade80);
    text-align:center;
    font-size:12px;
    color:#000;
}

.lista{
    padding:10px;
}

.card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0f172a;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
}

.bola{
    width:20px;
    height:20px;
    border-radius:50%;
}

.vermelho{ background:red; }
.preto{ background:black; }

.direita{
    font-size:12px;
    color:#facc15;
}

</style>
</head>

<body>

<div class="fundo"></div>

<div class="container">

<div class="topo">
    SCANNER DOUBLE
    <div class="relogio" id="relogio"></div>
</div>

<label for="fileInput">📸 Enviar Print</label>
<input type="file" id="fileInput" accept="image/*">

<div class="preview" id="preview"></div>

<div class="barra">
    <div class="progresso" id="progresso">0%</div>
</div>

<button onclick="gerarSinais()">GERAR SINAIS</button>

<div class="lista" id="lista"></div>

</div>

<script>

let coresDetectadas = [];
let pronto = false;

setInterval(()=>{
    document.getElementById("relogio").innerText =
        new Date().toLocaleTimeString('pt-BR',{
            timeZone:'America/Sao_Paulo',
            hour:'2-digit',
            minute:'2-digit',
            second:'2-digit'
        });
},1000);

document.getElementById("fileInput").addEventListener("change", function(e){

    let file = e.target.files[0];
    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(event){

        document.getElementById("preview").innerHTML = `
            <img src="${event.target.result}">
            <div class="scan"></div>
        `;

        iniciarLeitura();
    };

    reader.readAsDataURL(file);
});

function iniciarLeitura(){

    let barra = document.getElementById("progresso");
    let progresso = 0;

    pronto = false;

    let intervalo = setInterval(()=>{

        progresso += 2;
        barra.style.width = progresso + "%";
        barra.innerText = progresso + "%";

        if(progresso >= 100){
            clearInterval(intervalo);

            analisarFake();
            pronto = true;

            barra.innerText = "✔️ Concluído";

            gerarSinais();
        }

    }, 80);
}

function analisarFake(){
    coresDetectadas = Array.from({length:30},()=>Math.random()>0.5?"preto":"vermelho");
}

function analisar(h){
    let s=[];
    for(let i=2;i<h.length;i++){
        if(h[i-1]===h[i-2]){
            s.push(h[i-1]==="preto"?"vermelho":"preto");
        }
    }
    return s;
}

function pegarCor(a,i){
    return a[i] || (Math.random()>0.5?"preto":"vermelho");
}

function horaMin(d){
    return d.toLocaleTimeString('pt-BR',{
        timeZone:'America/Sao_Paulo',
        hour:'2-digit',
        minute:'2-digit'
    });
}

// 🔥 ALTERAÇÃO AQUI
function gerarSinais(){

    if(!pronto){
        alert("⛔ Aguarde a leitura terminar!");
        return;
    }

    let analise = analisar(coresDetectadas);

    let lista = document.getElementById("lista");
    lista.innerHTML="";

    let agora = new Date();
    agora.setMinutes(agora.getMinutes() + 3); // 👈 +3 MINUTOS

    for(let i=0;i<10;i++){

        let horario = new Date(agora.getTime()+i*120000);
        let cor = pegarCor(analise,i);

        let div = document.createElement("div");
        div.className="card";

        div.innerHTML=`
        <div>⏰ ${horaMin(horario)}</div>
        <div class="bola ${cor}"></div>
        <div class="direita">🛡️ Branco</div>
        `;

        lista.appendChild(div);
    }
}

</script>

</body>
                                                </html>
